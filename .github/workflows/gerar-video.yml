name: Gerar vídeo Billy Constrói
run-name: "Vídeo: ${{ inputs.tema != '' && inputs.tema || 'tema automático' }} (${{ inputs.modo }})"

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vazio = o Claude escolhe sozinho)"
        required: false
        default: ""
        type: string
      emocao:
        description: "Emoção do tema (só vale quando o tema é automático)"
        required: false
        default: "qualquer"
        type: choice
        options: [qualquer, medo/sobrevivência, nojo, dinheiro/conforto, assunto da semana]
      modo:
        description: "completo = vídeo pronto | so_roteiro = só tema+roteiro (barato) | teste_infra = ensaio sem API"
        required: false
        default: "completo"
        type: choice
        options: [completo, so_roteiro, teste_infra]
      blocos:
        description: "Número de blocos"
        required: false
        default: "5"
        type: choice
        options: ["4", "5", "6"]
      duracao_max:
        description: "Duração máxima em segundos"
        required: false
        default: "100"
        type: choice
        options: ["100", "125"]
      modelo:
        description: "Modelo do Claude (sonnet = econômico, opus = mais forte)"
        required: false
        default: "sonnet"
        type: choice
        options: [sonnet, opus]
      instrucoes:
        description: "Instruções extras para o roteiro e a cena (opcional)"
        required: false
        default: ""
        type: string
      rascunho:
        description: "Rascunho: segue mesmo se o roteiro/cena não passarem nas conferências"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gerador/requirements.txt

      - name: Instalar ffmpeg, cairo e fontes
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libcairo2-dev pkg-config python3-dev fonts-liberation fontconfig

      - name: Instalar dependências Python
        run: pip install -r gerador/requirements.txt

      - name: Conferir o Chrome (o motor 3D usa o Chrome do runner)
        run: |
          if [ -x /usr/bin/google-chrome ]; then google-chrome --version;
          else echo "Chrome ausente: instalando o Chromium do Playwright"; python -m playwright install --with-deps chromium; fi
          node --version; ffmpeg -version | head -1

      - name: Gerar o vídeo
        id: gerar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          POLY_PIZZA_KEY: ${{ secrets.POLY_PIZZA_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          MODELO_CLAUDE: ${{ vars.MODELO_CLAUDE }}
          MODELO_CLAUDE_FORTE: ${{ vars.MODELO_CLAUDE_FORTE }}
          TEMA: ${{ inputs.tema }}
          EMOCAO: ${{ inputs.emocao }}
          MODO: ${{ inputs.modo }}
          BLOCOS: ${{ inputs.blocos }}
          DURACAO: ${{ inputs.duracao_max }}
          MODELO: ${{ inputs.modelo }}
          INSTRUCOES: ${{ inputs.instrucoes }}
          RASCUNHO: ${{ inputs.rascunho }}
        run: |
          args=(--modo "$MODO" --emocao "$EMOCAO" --blocos "$BLOCOS" --duracao-max "$DURACAO" --modelo "$MODELO" --saida saida)
          if [ -n "$TEMA" ]; then args+=(--tema "$TEMA"); fi
          if [ -n "$INSTRUCOES" ]; then args+=(--instrucoes "$INSTRUCOES"); fi
          if [ "$RASCUNHO" = "true" ]; then args+=(--rascunho); fi
          python gerador/gerar.py "${args[@]}"

      - name: Guardar arquivos da execução (artefatos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: saida/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar na aba Releases (link permanente)
        if: success() && inputs.modo == 'completo'
        env:
          GH_TOKEN: ${{ github.token }}
          PASTA: ${{ steps.gerar.outputs.pasta }}
          SLUG: ${{ steps.gerar.outputs.slug }}
          STATUS: ${{ steps.gerar.outputs.status }}
        run: |
          titulo=$(python -c "import json,sys; print(json.load(open('$PASTA/resumo.json'))['titulo'])")
          marca=""; extra=()
          if [ "$STATUS" = "rascunho" ]; then marca="[RASCUNHO] "; extra+=(--prerelease); fi
          gh release create "video-${SLUG}-${{ github.run_number }}" \
            "$PASTA/video.mp4" "$PASTA/video.srt" "$PASTA/thumbnail.png" "$PASTA/publicacao.md" "$PASTA/relatorio.md" \
            --title "${marca}${titulo}" --notes-file "$PASTA/publicacao.md" "${extra[@]}"

      - name: Guardar a memória do gerador (temas usados, lições, modelos baixados)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gerador/estado gerador/LICOES_AUTO.md mec/modelos 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "memória do gerador (execução ${{ github.run_number }})"
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
          fi
