name: Descompactar pacote
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          sudo apt-get install -y p7zip-full
          mkdir -p /tmp/x
          7z x billy-constroi-OFC.7z -o/tmp/x -y
          SRC=/tmp/x
          if [ "$(ls -A $SRC | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -A $SRC)" ]; then SRC="$SRC/$(ls -A $SRC)"; fi
          rm -rf "$SRC/.git" "$SRC/.github"
          cp -a "$SRC"/. .
          rm billy-constroi-OFC.7z
      - name:
